  <div style="border: 1px solid black; padding:1rem;margin-bottom: 5px;">
    <h3>{{ prompt().title }} par {{ prompt().author.username }}</h3>
    <textarea readonly>{{ prompt().content }}</textarea>
    <div>
         <span> {{ prompt().category.name }}</span>
         <p-button label="UpVote" icon="pi pi-thumbs-up"></p-button>
        <span>Score: {{ prompt().score }}</span>
        <p-button label="DownVote" icon="pi pi-thumbs-down"></p-button>
    </div>
    <div>
      <p-button label="Copier" (click)="copyToClipboard()"></p-button>
      <p-button label="Modifier" (click)="editPrompt(prompt)"></p-button>
      <p-button label="Supprimer" (click)="deletePrompt(prompt)"></p-button>
    </div>
  </div>
