@if (isLoading()) {
  <div class="flex justify-content-center">
    <p-skeleton height="12rem" class="mb-3" />
  </div>
} @else {
  @for (prompt of prompts(); track prompt.id) {
    <app-prompt-card [prompt]="prompt" (deleted)="onDeleted(prompt.id)" />
  } @empty {
    <p>Aucun prompt pour le moment.</p>
  }
}
