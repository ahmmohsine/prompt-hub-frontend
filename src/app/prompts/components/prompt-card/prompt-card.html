<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="m-0">{{ prompt().title }}</h3>
      <div class="text-sm text-color-secondary">@{{ prompt().author.username }}</div>
    </div>
    <div class="flex gap-2">
      <p-button
        icon="pi pi-copy"
        size="small"
        (onClick)="copyToClipboard()"
        [text]="true"
      ></p-button>
      @if (canEdit()) {
        <p-button
          [routerLink]="['/prompts', prompt().id, 'edit']"
          icon="pi pi-pencil"
          size="small"
          [text]="true"
        ></p-button>

        <p-button icon="pi pi-trash" size="small" (onClick)="delete()" [text]="true"></p-button>
      }
    </div>
  </div>
  <textarea pTextarea class="w-full mb-2" rows="8" readonly>{{ prompt().content }}</textarea>
  <div class="flex justify-content-between">
    <p-tag severity="secondary" [value]="prompt().category.name"></p-tag>
    <div class="flex gap-2 align-items-center">
      <p-button
        [loading]="voting()"
        [severity]="userVote() === 'up' ? 'primary' : 'secondary'"
        icon="pi pi-thumbs-up"
        (onClick)="upvote()"
      ></p-button>
      <span>{{ score() }}</span>
      <p-button
        [loading]="voting()"
        [severity]="userVote() === 'down' ? 'primary' : 'secondary'"
        icon="pi pi-thumbs-down"
        (onClick)="downvote()"
      ></p-button>
    </div>
  </div>
</p-card>
