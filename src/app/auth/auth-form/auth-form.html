<p-card [header]="toString()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="username">Nom d'utilisateur</label>
      <input
        id="username"
        pInputText
        inputId="username"
        class="w-full"
        type="text"
        formControlName="username"
      />
      <small class="invalid-feedback">Le nom d'utilisateur est requis!</small>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <p-password
        inputStyleClass="w-full"
        inputId="password"
        formControlName="password"
        class="w-full"
      ></p-password>
      <small class="invalid-feedback">Le password est requis (min 4 carac.)!</small>
    </div>
    <div class="flex gap-2 justify-content-end">
      <p-button
        severity="secondary"
        (onClick)="toggleMode()"
        [label]="isLoging() ? 'Crée un compte' : 'Se connecter'"
      ></p-button>
      <p-button type="submit" [label]="isLoging() ? 'Connexion' : 'Crée le compte'"></p-button>
    </div>
  </form>
</p-card>
